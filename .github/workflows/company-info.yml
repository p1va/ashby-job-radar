name: Refresh company profiles

on:
  workflow_dispatch:
    inputs:
      board:
        description: Optional single company slug; leave blank for all current companies
        type: string
        default: ""
      force:
        description: Refresh even profiles fetched within the last 30 days
        type: boolean
        default: false
  schedule:
    - cron: "17 5 * * 1"

permissions:
  contents: write
  actions: write

concurrency:
  group: ashby-radar
  queue: max

jobs:
  enrich:
    if: github.repository == 'p1va/ashby-job-radar'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - name: Check cache and GraphQL contracts
        run: python -B -m unittest discover -s company-info -p 'test_*.py'

      - name: Refresh missing or month-old company profiles
        env:
          FORCE_REFRESH: ${{ inputs.force }}
          COMPANY_SLUG: ${{ inputs.board }}
        run: |
          flags=()
          if [ "$FORCE_REFRESH" = "true" ]; then
            flags+=(--force)
          fi
          if [ -n "$COMPANY_SLUG" ]; then
            flags+=(--board "$COMPANY_SLUG")
          fi
          python -B company-info/refresh.py \
            --report "$RUNNER_TEMP/company-info-report.json" "${flags[@]}"

      - name: Save successful profiles even if later requests fail
        id: save
        if: ${{ always() && !cancelled() }}
        run: |
          git config user.name ashby-radar-bot
          git config user.email actions@users.noreply.github.com
          git add company-info/companies.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh cached company profiles"
            git pull --rebase origin main
            git push origin HEAD:main
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Rebuild the board when profiles changed
        if: ${{ !cancelled() && steps.save.outputs.changed == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run job-board.yml --ref main

      - name: Show enrichment summary
        if: ${{ !cancelled() }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path
          report = Path(os.environ["RUNNER_TEMP"]) / "company-info-report.json"
          if report.exists():
              r = json.loads(report.read_text())
              text = (f"Company profiles: **{len(r['updated'])} updated**, {len(r['cached'])} fresh in cache, "
                      f"{len(r['failed'])} failed, {len(r['deferred'])} deferred.\n")
              with open(os.environ["GITHUB_STEP_SUMMARY"], "a") as summary:
                  summary.write(text)
          PY
      - name: Save report and checkpointed cache
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v7
        with:
          name: company-info-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/company-info-report.json
            company-info/companies.json
          retention-days: 30
