name: Digest preview (no email)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag or commit in this fork to test
        required: true
        default: main
        type: string
      scope:
        description: Listed companies only, or include Common Crawl discovery
        required: true
        default: full
        type: choice
        options:
          - listed
          - full

permissions:
  contents: write

concurrency:
  group: ashby-radar
  queue: max

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Prepare preview config
        env:
          PREVIEW_SCOPE: ${{ inputs.scope }}
        run: |
          python - <<'PY'
          import json
          import os
          from pathlib import Path

          config = json.loads(Path("config.json").read_text())
          if os.environ["PREVIEW_SCOPE"] == "listed":
              config.setdefault("harvest", {})["enabled"] = False
              config["discovery_queries"] = []
          path = Path(os.environ["RUNNER_TEMP"]) / "preview-config.json"
          path.write_text(json.dumps(config), encoding="utf-8")
          PY

      - name: Generate digest without email
        run: |
          python ashby_radar.py --no-email \
            --config "$RUNNER_TEMP/preview-config.json" \
            --out "$RUNNER_TEMP/preview-digest"

      - name: Show digest in run summary
        if: always()
        run: |
          if [ -f "$RUNNER_TEMP/preview-digest/digest.md" ]; then
            cat "$RUNNER_TEMP/preview-digest/digest.md" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Save digest
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/preview-digest/
          if-no-files-found: error
          retention-days: 30

      - name: Save state and digest
        if: always() && !cancelled() && inputs.ref == 'main'
        run: |
          if [ ! -f "$RUNNER_TEMP/preview-digest/run.json" ]; then
            exit 0
          fi
          mkdir -p output
          cp "$RUNNER_TEMP/preview-digest/"* output/
          git config user.name ashby-radar-bot
          git config user.email actions@users.noreply.github.com
          git add companies.txt boards.json output/
          if [ -f seen.json ]; then
            git add seen.json
          fi
          if ! git diff --cached --quiet; then
            git commit -m "radar: $(date -u +%F)"
            git pull --rebase origin main
            git push origin HEAD:main
          fi
